<!-- 승우: 커뮤니티 > 스포일러. 다른 컴포넌트와 안 겹치게 클래스는 전부 sp- 로 시작 -->
<div class="sp">

    <header class="sp-intro">
        <p class="sp-kicker">⚠️ 스포일러 주의</p>
        <h1 class="sp-headline">줄거리부터 결말까지, <em>한 번에</em></h1>
        <p class="sp-lead">영화와 넷플릭스·디즈니+ 같은 OTT 시리즈를 검색하면 줄거리와 결말을 한 창에 정리해 드려요. 시리즈는 시즌을 나누지 않고 작품 전체의 결말을 보여 드려요. 내용은 흐리게 가려져 있으니, 보고 싶은 부분만 눌러서 확인하세요.</p>
    </header>

    <form class="sp-search" id="sp-search" role="search">
        <label class="sp-sr" for="sp-query">영화 또는 시리즈 제목</label>
        <input id="sp-query" type="search" maxlength="100" autocomplete="off" placeholder="결말이 궁금한 영화나 시리즈 제목을 입력하세요">
        <button type="submit" id="sp-submit">검색</button>
    </form>
    <div class="sp-examples" id="sp-examples" aria-label="예시 작품"></div>

    <div class="sp-results" id="sp-results" aria-live="polite"></div>

    <article class="sp-card" id="sp-card" hidden aria-live="polite"></article>
</div>
