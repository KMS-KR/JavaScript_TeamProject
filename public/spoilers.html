<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0;url=/#spoiler" />
    <title>스포일러 페이지 이동 중</title>
    <script>
      (function(){
        var target=new URL('/',window.location.origin);
        var movieId=new URLSearchParams(window.location.search).get('movie');
        if(movieId&&/^[1-9]\d{0,9}$/.test(movieId))target.searchParams.set('movie',movieId);
        target.hash='spoiler';
        window.location.replace(target.href);
      })();
    </script>
  </head>
  <body>
    <p>팀 스포일러 페이지로 이동 중입니다. <a href="/#spoiler">이동하지 않으면 여기를 눌러 주세요.</a></p>
  </body>
</html>
